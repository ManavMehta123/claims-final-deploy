version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: claims-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: claims-backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever USE_DB is set to in .env so this compose file
      # always runs against the Mongo container above.
      USE_DB: "true"
      MONGO_URI: "mongodb://mongo:27017/claims_management"
      ML_SERVICE_URL: "http://ml-service:5001"
    depends_on:
      - mongo
      - ml-service
    # No published ports: the only way in is through the Nginx gateway below.
    expose:
      - "5000"

  # --- Claim Prediction Model service -------------------------------------
  # Flask API serving the two-stage claim prediction models (condition
  # classifier + amount regressor) trained in ml-service/train.py and
  # tracked with MLflow. The backend proxies POST /api/predict-claim here.
  ml-service:
    build: ./ml-service
    container_name: claims-ml-service
    expose:
      - "5001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.0}
    # artifacts/ and data/ are shared with the Airflow containers below via
    # named volumes so a model version promoted by the retraining DAG (or
    # a live_feedback.csv row appended by the ingestion DAG) is visible to
    # this service too, without either side needing to know about Docker.
    volumes:
      - ml_artifacts:/app/artifacts
      - ml_data:/app/data

  # --- Continuous Learning Pipeline (Story) --------------------------------
  # Airflow orchestrates two DAGs (see ml-service/airflow/dags/):
  #   data_ingestion_dag        - pulls newly-decided claims (daily) via
  #                                GET /api/ml/training-export and appends
  #                                them to ml-service/data/live_feedback.csv
  #   continuous_retraining_dag - retrains a challenger model, evaluates it
  #                                against the current champion, and
  #                                promotes it only if it's good enough
  #                                (ml-service/evaluate_and_promote.py)
  # Model versioning + rollback live in ml-service/registry.py and are
  # exposed both as an ml-service HTTP API (/model/versions,
  # /model/rollback) and a standalone CLI (ml-service/rollback.py) that
  # works even if ml-service itself is down.
  airflow-postgres:
    image: postgres:16-alpine
    container_name: claims-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ./ml-service
      dockerfile: airflow/Dockerfile
    container_name: claims-airflow-init
    depends_on:
      - airflow-postgres
    environment:
      <<: &airflow-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        BACKEND_URL: "http://backend:5000"
        ML_SERVICE_URL: "http://ml-service:5001"
        INGESTION_USERNAME: ${INGESTION_USERNAME:-}
        INGESTION_PASSWORD: ${INGESTION_PASSWORD:-}
    user: "0:0"
    entrypoint: /bin/bash
    command: -c "chown -R 50000:0 /opt/ml-service/artifacts /opt/ml-service/data && airflow db migrate && airflow users create --username admin --password admin --firstname Numiqers --lastname Intern --role Admin --email admin@example.com || true"
    volumes:
      - ./ml-service/airflow/dags:/opt/airflow/dags
      - ./ml-service:/opt/ml-service
      - ml_artifacts:/opt/ml-service/artifacts
      - ml_data:/opt/ml-service/data
      - airflow_logs:/opt/airflow/logs
      
  airflow-webserver:
    build:
      context: ./ml-service
      dockerfile: airflow/Dockerfile
    container_name: claims-airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-env
    command: webserver
    ports:
      - "8081:8080"
    volumes:
      - ./ml-service/airflow/dags:/opt/airflow/dags
      - ./ml-service:/opt/ml-service
      - ml_artifacts:/opt/ml-service/artifacts
      - ml_data:/opt/ml-service/data
      - airflow_logs:/opt/airflow/logs

  airflow-scheduler:
    build:
      context: ./ml-service
      dockerfile: airflow/Dockerfile
    container_name: claims-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-env
    command: scheduler
    volumes:
      - ./ml-service/airflow/dags:/opt/airflow/dags
      - ./ml-service:/opt/ml-service
      - ml_artifacts:/opt/ml-service/artifacts
      - ml_data:/opt/ml-service/data
      - airflow_logs:/opt/airflow/logs

  nginx:
    image: nginx:1.27-alpine
    container_name: claims-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # --- Monitoring stack (Story 5) ---------------------------------------
  # Prometheus scrapes GET /metrics on the backend every 15s (see
  # monitoring/prometheus.yml) and Grafana visualizes it. Neither is
  # routed through the Nginx gateway; reach them directly on their own
  # ports, same as Mongo above.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: claims-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: claims-grafana
    ports:
      - "3001:3000"
    environment:
      # Demo-only convenience login; change before any real deployment.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
  ml_artifacts:
  ml_data:
  airflow_postgres_data:
  airflow_logs:
