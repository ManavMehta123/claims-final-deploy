version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - frontend/node_modules/**/*

# Set VITE_API_BASE_URL as an environment variable in the Amplify Console
# (App settings -> Environment variables) pointing at your deployed
# backend/gateway, e.g. https://your-backend-domain.com/api
# Without it, the built frontend falls back to a relative /api path, which
# only works when frontend and backend share an origin.
