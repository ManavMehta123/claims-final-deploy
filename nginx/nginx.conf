# Nginx as the API Gateway for the Claims Management System (Story 3).
#
# Responsibilities handled here, in front of the Node/Express API:
#   - Single public entry point (clients never talk to the backend directly)
#   - Rate limiting (defense against abuse/DoS, independent of the app-level
#     login limiter in Express)
#   - Baseline security headers
#   - Reverse proxy to the backend service, with the Node process never
#     exposed on a public port itself

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # 10 requests/sec per client IP, generic gateway-level throttle.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 8080;
    server_name _;

    # Security headers applied to every response leaving the gateway.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gateway-level rate limiting, allowing short bursts (e.g. a page that
    # fires several API calls at once) without hard-blocking normal use.
    limit_req zone=api_limit burst=20 nodelay;
    client_max_body_size 50m;

    location /health {
      proxy_pass http://backend:5000/health;
      proxy_set_header Host $host;
    }

    location /api-docs {
      proxy_pass http://backend:5000/api-docs;
      proxy_set_header Host $host;
    }

    location /api-docs.json {
      proxy_pass http://backend:5000/api-docs.json;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # JWT is just a normal Authorization header, so nothing special is
      # needed here — it passes straight through to Express, which is what
      # actually verifies it.
    }

    location / {
      return 404;
    }
  }
}
